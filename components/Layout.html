{{define "Layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
</head>
<body>
    {{template "Header" .}}  <!-- Include header -->
    <main>
        {{template "Content" .}} <!-- {Content of the specific page -->
    </main>
    {{template "Footer" .}}  <!-- Include footer -->
</body>
</html>
{{end}}
