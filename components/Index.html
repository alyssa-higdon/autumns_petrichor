{{ define "Content" }}
  <!-- Courses Display -->
<div class="course">
    <h2>{{.Data.Title}}</h2>
        <div class="course__container">
              {{range .Data.Courses}}
                  <div class="course__card">
                    <h2>{{.CourseName}}</h2>
                    <p>{{.University}}</p>
                    <button onclick="location.href='course/{{.Id}}'">Get Started</button>
                  </div>
               {{end}}
          </div>
        </div>  
{{ end}}
