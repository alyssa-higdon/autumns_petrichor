                    </li>

  <!-- Courses Display -->
<div class="course">
    <h2>{{.Title}}</h2>
        <div class="course__container">
              {{range .Courses}}

                    <h2>{{.CourseName}}</h2>
                    <p>{{.University}}</p>
                    <button>Get Started</button>
                  </div>
               {{end}}
          </div>
        </div>
