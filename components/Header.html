{{define "Header"}}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!---link rel="icon"href="/assets/favicon.ico"--->
    <title>Autumns Petrichor</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/072fedbc95.js" crossorigin="anonymous"></script>

</head>
    <body>
        <nav class="navbar">
            <div class="navbar__container">
                <a href="/" id="navbar__logo"><i class="fa-solid fa-leaf"></i>Autumns Petrichor</a>
                <div class="navbar__toggle" id="mobile-menu">
                    <span class="bar"></span>
                </div>
                <ul class="navbar__menu">
                    <li>
                        <button onclick="document.getElementById('loginModal').style.display='block'">Log in</button>
                    </li>
                </ul>
            </div>
        </nav>

    <!-- The Log In Modal -->
<div id="loginModal" class="modal">
    <span onclick="document.getElementById('loginModal').style.display='none'"
  class="close" title="Close Modal">&times;</span>
  
    <!-- Modal Content -->
    <form class="modal-content animate" action="/action_page.php" method="POST">
        <label for="uname"><b>Username</b></label>
        <input type="text" placeholder="Username" name="uname" required>
  
        <label for="psw"><b>Password</b></label>
        <input type="password" placeholder="Password" name="psw" required>
  
        <button type="submit">Login</button>
        <label>
          <input type="checkbox" checked="checked" name="remember"> Remember me
        </label>

        <br>
        
        <div class="account"><a href="#">Create Account</a></div>
        <br>
        <div class="account">Forgot <a href="#">password?</a></div>
        <button onclick="document.getElementById('loginModal').style.display='none'" class="cancelbtn">Cancel</button>
      </div>
    </form>

{{end}}
